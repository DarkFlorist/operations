version: '3.2'

services:
  agent:
    deploy:
      mode: 'global'
      placement:
        constraints: [node.platform.os == linux]
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    image: 'portainer/agent:2.41.1@sha256:0dca6009cef65889e5f9f71933194b92b09a9d56301ba12b1544344118d8d1e2'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/var/lib/docker/volumes:/var/lib/docker/volumes'
    networks:
      - 'portainer-agents'

  portainer:
    deploy:
      mode: 'replicated'
      replicas: 1
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.my-portainer-router.tls=true'
        - 'traefik.http.routers.my-portainer-router.entrypoints=websecure'
        - 'traefik.http.routers.my-portainer-router.rule=Host(`portainer.dark.florist`)'
        - 'traefik.http.routers.my-portainer-router.service=my-portainer-service'
        - 'traefik.http.services.my-portainer-service.loadbalancer.server.port=9000'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    image: 'portainer/portainer-ce:2.41.1@sha256:0a110a56be09374e69f73748216b1c47e76284d8a7baa5363e8804e2a6bb4aff'
    command: '-H tcp://tasks.agent:9001 --tlsskipverify'
    # uncomment these initially so you can connect to localhost:9000 via SSH tunnel, and then comment them back out once traefik is up and running
    # this lets us use Portainer to deploy Traefik, but then use Traefik to access portainer with proper end to end TLS termination once things are up
    #ports:
    #  - '9443:9443'
    #  - '9001:9000'
    #  - '8000:8000'
    volumes:
      - 'portainer_data:/data'
      # workaround for https://github.com/portainer/portainer/issues/8806
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - 'portainer-agents'
      - 'traefik'
      # needs internet access to pull stack definitions from GitHub
      - 'public-facing'

networks:
  portainer-agents:
    driver: 'overlay'
    attachable: true
    internal: true
  traefik:
    external: true
  public-facing:
    external: true

volumes:
  portainer_data:
