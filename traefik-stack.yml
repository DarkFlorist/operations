version: '3'

services:
  traefik:
    deploy:
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.my-traefik-dashboard-router.tls=true'
        - 'traefik.http.routers.my-traefik-dashboard-router.rule=Host(`traefik.dark.florist`)'
        - 'traefik.http.routers.my-traefik-dashboard-router.service=api@internal'
        - 'traefik.http.routers.my-traefik-dashboard-router.entrypoints=websecure'
        - 'traefik.http.routers.my-traefik-dashboard-router.middlewares=my-traefik-middleware@swarm'
        - 'traefik.http.middlewares.my-traefik-middleware.basicauth.usersfile=/run/secrets/traefik-users'
        # # Dummy service for Swarm port detection. The port can be any valid integer value.
        - 'traefik.http.services.dummy-svc.loadbalancer.server.port=9999'
      restart_policy:
        condition: 'any'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    # https://hub.docker.com/_/traefik/tags
    image: 'traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42'
    command:
        - '--providers.file.filename=/traefik-config.yml' # CLI or environment configuration is preferred, but traefik only lets you set the TLS certificate paths via file configurtion
        - '--providers.swarm.endpoint=unix:///var/run/docker.sock'
        - '--providers.swarm.watch=true'
        - '--providers.swarm.exposedByDefault=false'
        - '--providers.swarm.network=traefik'
        - '--entryPoints.websecure.address=:443'
        - '--entrypoints.websecure.http.tls=true'
        - '--api.dashboard=true'
        - '--api.insecure=false'
    networks:
      - 'traefik'
    ports:
      - target: 443
        published: 443
        protocol: 'tcp'
    volumes:
      - type: 'bind'
        source: '/var/run/docker.sock'
        target: '/var/run/docker.sock'
    configs:
      - source: 'traefik-config.yml'
        target: '/traefik-config.yml'
    secrets:
      - source: 'traefik-users'
        target: '/run/secrets/traefik-users'
      - source: 'dark.florist-private-key'
        target: '/run/secrets/dark.florist-private-key'
      - source: 'dark.florist-origin-certificate'
        target: '/run/secrets/dark.florist-origin-certificate'

networks:
  # note: published ports bypass any internal network restrictions
  # internal private network with services that traefik should route to
  traefik:
    driver: 'overlay'
    external: true

configs:
  # keeping config in docker-compose file is preferable, but Traefik stupidly doesn't let you set certificate path via CLI config, so we have to put it in a file config
  traefik-config.yml:
    external: true

secrets:
  # TLS key
  dark.florist-private-key:
    external: true
  # TLS certificate
  dark.florist-origin-certificate:
    external: true
  # users that can login to the traefik UI
  traefik-users:
    external: true
